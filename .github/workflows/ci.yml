name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run typecheck, lint, unit/contract tests and smoke e2e
        env:
          CI: "1"
          E2E_FULL_MOBILE_MATRIX: "1"
        run: npm run ci:smoke
