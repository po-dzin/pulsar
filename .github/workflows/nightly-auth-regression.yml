name: Nightly Auth Regression

on:
  workflow_dispatch:

jobs:
  auth-user:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      E2E_STORAGE_STATE_USER: ${{ secrets.E2E_STORAGE_STATE_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Prepare user auth storage state
        run: npm run e2e:auth:state:user

      - name: Run user auth regression
        env:
          E2E_AUTHENTICATED: "1"
          E2E_STORAGE_STATE: tests/e2e/.auth/user.json
          E2E_FULL_MOBILE_MATRIX: "1"
          CI: "1"
        run: |
          npm run test:e2e:core
          npm run test:e2e:auth:user

      - name: Upload user auth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth-user-report
          path: |
            playwright-report
            test-results

  auth-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      E2E_STORAGE_STATE_ADMIN: ${{ secrets.E2E_STORAGE_STATE_ADMIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Prepare admin auth storage state
        run: npm run e2e:auth:state:admin

      - name: Run admin auth regression
        env:
          E2E_AUTHENTICATED: "1"
          E2E_STORAGE_STATE: tests/e2e/.auth/admin.json
          E2E_FULL_MOBILE_MATRIX: "1"
          CI: "1"
        run: npm run test:e2e:auth:admin

      - name: Upload admin auth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth-admin-report
          path: |
            playwright-report
            test-results
